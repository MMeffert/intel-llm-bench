# services/llm-bench/models.yaml
# Every repo/file below was verified 2026-08-13 via the Hugging Face API
# (siblings listing, confirms the exact filename) and a `curl -sI` HEAD
# check against the resolve URL (confirms a real 302 to a signed CDN URL,
# not a guess). All report gated:false — no HF token needed to download,
# despite Google's own Gemma repos being gated; Unsloth's GGUF mirrors
# are not.
#
# MoE entries (gemma-4-26b-a4b, qwen3.6-35b-a3b) use "cpu_offload" so the
# 128GB system RAM actually gets exercised — llama.cpp's tensor-override
# flag for this is confirmed against the winning backend's real --help
# output in Task 2/4, not assumed here.
#
# NPU note (2026-08-13): the Arrow Lake NPU (13 TOPS, /dev/accel/accel0) is
# NOT reachable via llama.cpp+Vulkan — it's not a Vulkan-capable device, only
# OpenVINO's NPU plugin can target it. None of the models below run on NPU as
# a result. A separate, right-sized NPU test (Qwen3-Embedding-0.6B via
# OpenArc/OpenVINO — literally the model OpenVINO 2026.0 added NPU support
# for) was run standalone instead, since forcing a chat LLM onto the NPU
# would be a mismatched workload and Gemma 4 (this file's smallest model)
# already crashes on OpenVINO's pipeline regardless of device. See
# shootout-results.md for that result.
models:
  - name: gemma-4-e4b
    repo: unsloth/gemma-4-E4B-it-GGUF
    file: gemma-4-E4B-it-Q4_K_M.gguf
    # "E4B" is a MatFormer effective-compute label (same convention as Gemma 3n), not the
    # actual stored param count — llama-bench's own JSON output reports 7.52B on load.
    # Confirmed during the shootout (services/llm-bench/shootout-results.md).
    params_total_b: 7.52
    params_active_b: 7.52
    quant: Q4_K_M
    devices: [a770, igpu]

  - name: qwen2.5-coder-7b
    repo: bartowski/Qwen2.5-Coder-7B-Instruct-GGUF
    file: Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf
    params_total_b: 7
    params_active_b: 7
    quant: Q4_K_M
    devices: [a770]

  - name: gemma-4-12b
    repo: unsloth/gemma-4-12b-it-GGUF
    file: gemma-4-12b-it-Q4_K_M.gguf
    params_total_b: 12
    params_active_b: 12
    quant: Q4_K_M
    devices: [a770]

  - name: devstral-2-24b
    repo: unsloth/Devstral-Small-2-24B-Instruct-2512-GGUF
    file: Devstral-Small-2-24B-Instruct-2512-Q4_K_M.gguf
    params_total_b: 24 # corrected from the plan's earlier "22B" guess — actual model is 24B
    params_active_b: 24
    quant: Q4_K_M
    devices: [a770]

  - name: qwen3.6-27b
    repo: unsloth/Qwen3.6-27B-GGUF
    file: Qwen3.6-27B-Q4_K_M.gguf
    params_total_b: 27
    params_active_b: 27
    quant: Q4_K_M
    devices: [a770]

  - name: gemma-4-31b
    repo: unsloth/gemma-4-31B-it-GGUF
    file: gemma-4-31B-it-Q4_K_M.gguf
    params_total_b: 31
    params_active_b: 31
    quant: Q4_K_M
    devices: [a770]

  - name: gemma-4-26b-a4b
    repo: unsloth/gemma-4-26B-A4B-it-GGUF
    file: gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
    params_total_b: 25.2
    params_active_b: 3.8
    quant: UD-Q4_K_M
    devices: [cpu_offload]

  - name: qwen3.6-35b-a3b
    repo: unsloth/Qwen3.6-35B-A3B-GGUF
    file: Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
    params_total_b: 35
    params_active_b: 3
    quant: UD-Q4_K_M
    devices: [cpu_offload]

  # 2026-08-13 overnight expansion — added model-family breadth per Mitchell's request
  # (more families at the same Q4 quant, not more quant levels of what's already here).
  # All verified via the same HF API + curl -sI check as the original 8.
  - name: phi-4-mini
    repo: unsloth/Phi-4-mini-instruct-GGUF
    file: Phi-4-mini-instruct-Q4_K_M.gguf
    params_total_b: 3.8 # Microsoft's nominal figure — confirm against llama-bench's own reported params_total on load, same as gemma-4-e4b's E4B/7.52B discrepancy
    params_active_b: 3.8
    quant: Q4_K_M
    devices: [a770, igpu] # second device-comparison anchor point alongside gemma-4-e4b

  - name: mistral-small-3.2-24b
    repo: unsloth/Mistral-Small-3.2-24B-Instruct-2506-GGUF
    file: Mistral-Small-3.2-24B-Instruct-2506-Q4_K_M.gguf
    params_total_b: 24
    params_active_b: 24
    quant: Q4_K_M
    devices: [a770]

  - name: deepseek-r1-distill-qwen-7b
    repo: unsloth/DeepSeek-R1-Distill-Qwen-7B-GGUF
    file: DeepSeek-R1-Distill-Qwen-7B-Q4_K_M.gguf
    params_total_b: 7
    params_active_b: 7
    quant: Q4_K_M
    devices: [a770]

  # 2026-08-14 round — new vendor/architecture breadth, verified via HF API + curl -sIL
  # (the -L matters here: unsloth resolve URLs 302 to a signed CDN URL, and a plain -sI
  # against the redirect target returns a tiny HTML/LFS-pointer content-length that looks
  # like a real response but isn't — caught this on the first pass for these three).
  - name: nvidia-nemotron-3.5-lightning-30b-a3b
    repo: unsloth/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF
    file: NVIDIA-Nemotron-3.5-Lightning-30B-A3B-UD-Q4_K_M.gguf
    params_total_b: 30
    params_active_b: 3 # A3B naming convention, matches gemma-4-26b-a4b/qwen3.6-35b-a3b pattern
    quant: UD-Q4_K_M
    devices: [cpu_offload] # first NVIDIA-family entry in the matrix

  - name: lfm2.5-8b-a1b
    repo: unsloth/LFM2.5-8B-A1B-GGUF
    file: LFM2.5-8B-A1B-UD-Q4_K_M.gguf
    params_total_b: 8
    params_active_b: 1
    quant: UD-Q4_K_M
    # Liquid AI's LFM architecture (non-standard-transformer, "edge"-tagged) — small
    # enough (5.3GB) that the 1B active-param MoE fits fully GPU-resident without
    # needing -ncmoe offload, unlike the other MoE entries here. Tested as [a770] for
    # that reason, not [cpu_offload].
    devices: [a770]

  - name: ornith-1.0-9b
    repo: unsloth/Ornith-1.0-9B-GGUF
    file: Ornith-1.0-9B-Q4_K_M.gguf
    params_total_b: 9
    params_active_b: 9
    quant: Q4_K_M
    # DeepReinforce AI (deepreinforce-ai/Ornith-1.0-9B on HF) — tagged qwen3_5_moe
    # architecture internally but ships as a single dense-shaped Q4_K_M file with no
    # -A active-param suffix, so treated as a normal dense entry here.
    devices: [a770]

  # NOT included this round: Llama 4 Scout (109B total / 17B active MoE). Its GGUF ships
  # as a split file (Q4_K_M-00001-of-00002 + 00002-of-00002, ~55GB combined) that
  # bench-model.sh's single-file download doesn't support, and the size alone risks
  # dominating an unattended overnight run. Worth adding as a real follow-up — extend
  # bench-model.sh to fetch and concatenate/pass both parts to llama-bench (llama.cpp
  # auto-detects split GGUF siblings when pointed at the first file) — not attempted here
  # under time pressure right before an unattended run started.
